name: проверки

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Настроить Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Настроить Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Настроить Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Установить пакеты Android
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108"

      - name: Запустить испытания
        run: |
          chmod +x gradlew scripts/*.sh
          go mod download
          (cd go_client && go mod download)
          go test ./...
          (cd go_client && go test ./...)
          ./gradlew --no-daemon :app:testDebugUnitTest

  server-container:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Собрать образ сервера
        run: docker build --tag wdtt-server:check --file docker/wdtt/Dockerfile .
