name: Публикация образа WDTT Server
run-name: WDTT Server @ ${{ github.sha }}

on:
  push:
    branches:
      - master
    paths:
      - server.go
      - go.mod
      - docker/wdtt/**
      - .github/workflows/publish-server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-wdtt-server-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/makriq-org/proxy-turn-vk-android/wdtt-server

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Собрать и опубликовать образ
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/wdtt/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:prod
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=qWDTT server
