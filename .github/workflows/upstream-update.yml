name: Обновление апстрима

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-update
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: SpaceNeuroX/proxy-turn-vk-android
  UPSTREAM_BRANCH: master
  FORK_BRANCH: master

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Получить форк
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Получить апстрим
        id: upstream
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          UPSTREAM_SHA="$(git rev-parse "upstream/$UPSTREAM_BRANCH")"
          SHORT_SHA="$(git rev-parse --short=12 "$UPSTREAM_SHA")"
          NEW_COMMITS="$(git rev-list --count "$UPSTREAM_SHA" --not "origin/$FORK_BRANCH")"

          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "Новых коммитов апстрима нет."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base "$UPSTREAM_SHA" "origin/$FORK_BRANCH" >/dev/null; then
            echo "У форка и апстрима не найдена общая история." >&2
            exit 1
          fi

          VERSION_NAME="$(
            git show "$UPSTREAM_SHA:app/build.gradle.kts" |
              sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' |
              head -n1
          )"
          SYNC_BRANCH="sync/upstream-$SHORT_SHA"

          git push origin "$UPSTREAM_SHA:refs/heads/$SYNC_BRANCH"

          {
            echo "has_updates=true"
            echo "sha=$UPSTREAM_SHA"
            echo "short_sha=$SHORT_SHA"
            echo "sync_branch=$SYNC_BRANCH"
            echo "new_commits=$NEW_COMMITS"
            echo "version_name=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Открыть pull request
        if: steps.upstream.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.upstream.outputs.sync_branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
          VERSION_NAME: ${{ steps.upstream.outputs.version_name }}
          NEW_COMMITS: ${{ steps.upstream.outputs.new_commits }}
        run: |
          set -euo pipefail

          EXISTING_PR="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --head "$SYNC_BRANCH" \
              --json url \
              --jq '.[0].url // empty'
          )"
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request уже существует: $EXISTING_PR"
            exit 0
          fi

          TITLE="Обновить апстрим до $SHORT_SHA"
          if [ -n "$VERSION_NAME" ]; then
            TITLE="Обновить апстрим до v${VERSION_NAME#v}"
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "Автоматически подготовленное обновление из \`$UPSTREAM_REPOSITORY\`."
            echo
            echo "- Ветка: \`$UPSTREAM_BRANCH\`"
            echo "- Коммит: \`$UPSTREAM_SHA\`"
            echo "- Новых коммитов: $NEW_COMMITS"
            echo
            echo "Для слияния используйте merge commit. Squash или rebase нарушит отслеживание истории апстрима."
          } > "$BODY_FILE"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$FORK_BRANCH" \
            --head "$SYNC_BRANCH" \
            --title "$TITLE" \
            --body-file "$BODY_FILE"
